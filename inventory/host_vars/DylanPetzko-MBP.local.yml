---
# Redhorse Corporation Apple-silicon work laptop.
common_manage_hostname: true
common_hostname: "DylanPetzko-MBP.local"

# Bitwarden desktop app in addition to the bitwarden-cli Homebrew formula.
common_homebrew_casks_host:
  - bitwarden

# Podman CLI complements the Darwin-wide Homebrew dependency.
common_packages_host:
  - podman

# Every local opt-in role, ordered by dependency.
additional_roles:
  - bitwarden
  - zsh
  - cli
  - git
  - neovim
  - herdr
  - libreoffice
  - orca
  - k8s-tools
  - upstream-tools
  - docker
  - tailscale
  - petzko.omp.omp_full

# Match the personal-laptop secret policy.
bitwarden_ssh_keys:
  - item: "b5da5a47-9423-4d97-b3cc-b469003cabdd" # petzkod Github
    dest: "{{ bitwarden_ssh_dir }}/id_ed25519"
bitwarden_notes:
  - item: "sops-age-pgp-key"
    dest: "{{ bitwarden_home }}/.config/sops/age/keys.txt"
    mode: "0600"
