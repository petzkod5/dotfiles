---
# Darwin hosts use Homebrew formulae and casks rather than Linux package tools.
common_manage_flatpak: false
# macOS `systemsetup` exposes UTC as GMT.
common_timezone: "GMT"
common_manage_etc_hosts: false
common_manage_locale: false
common_user_shell: /bin/zsh

# Linux-specific package additions do not apply to Homebrew hosts.
common_packages_family: []
common_homebrew_casks_family:
  - discord
