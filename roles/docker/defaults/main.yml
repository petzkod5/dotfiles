---
# =============================================================================
# docker role — install Docker Engine + Compose and enable the daemon on Linux.
# Darwin installs the Docker Desktop cask; its application owns service lifecycle.
# Linux login users join the `docker` group for non-sudo access.
# =============================================================================
docker_packages_debian:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_packages_archlinux:
  - docker
  - docker-compose
docker_service: docker
docker_cask_macos: docker-desktop
# Add the login user to the docker group (rootless-ish convenience).
docker_manage_group: true
