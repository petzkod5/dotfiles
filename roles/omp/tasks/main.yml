---
# Install the oh-my-pi (omp) coding agent binary from upstream releases and
# symlink a repo-tracked config into ~/.omp/agent/config.yml. Runs as the user
# (become: false, via the additional_roles play) and writes only inside the
# user's home. Assumes a local connection so the config symlink target (this
# repo) exists on the machine. Edit roles/omp/files/config.yml (or
# ~/.omp/agent/config.yml through the symlink) and commit to track your config.

- name: Identify the target user
  ansible.builtin.command:
    cmd: id -un
  register: _omp_user
  changed_when: false
  check_mode: false

- name: Look up the target user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ _omp_user.stdout }}"

- name: Resolve the home directory
  ansible.builtin.set_fact:
    omp_home: "{{ ansible_facts.getent_passwd[_omp_user.stdout][4] }}"

# --- Install the omp binary (versioned dir + symlink onto PATH) --------------
# The versioned filename doubles as the idempotency marker: get_url skips the
# download when it already exists, and bumping omp_version re-downloads and
# re-points the PATH symlink.

- name: Ensure the omp install directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ omp_lib_dir }}"
    - "{{ omp_bin_dir }}"
  # Create for real even during --check so the get_url below (which validates
  # its destination directory) passes a `dotfiles check` on a fresh install.
  check_mode: false

- name: Download the pinned omp binary
  ansible.builtin.get_url:
    url: "{{ omp_download_url }}"
    dest: "{{ omp_lib_dir }}/{{ omp_asset }}-{{ omp_version }}"
    mode: "0755"

- name: Symlink the omp binary onto PATH
  ansible.builtin.file:
    src: "{{ omp_lib_dir }}/{{ omp_asset }}-{{ omp_version }}"
    dest: "{{ omp_bin_dir }}/omp"
    state: link
    force: true

# --- Symlink the repo-tracked config ----------------------------------------

- name: Ensure the omp config directory exists
  ansible.builtin.file:
    path: "{{ omp_config_dir }}"
    state: directory
    # 0700 matches omp's own convention: the agent dir holds sessions, history
    # and memories, so keep it private rather than widening it.
    mode: "0700"

- name: Check for an existing omp config
  ansible.builtin.stat:
    path: "{{ omp_config_file }}"
  register: _omp_cfg

- name: Back up a pre-existing real omp config (once)
  ansible.builtin.copy:
    src: "{{ omp_config_file }}"
    dest: "{{ omp_config_file }}.pre-ansible"
    remote_src: true
    force: false
  when:
    - _omp_cfg.stat.exists
    - not _omp_cfg.stat.islnk

- name: Symlink the omp config to the repo-tracked file
  ansible.builtin.file:
    src: "{{ role_path }}/files/config.yml"
    dest: "{{ omp_config_file }}"
    state: link
    force: true

# --- Symlink the repo-tracked RULES.md (user-level sticky rules) -------------
# omp loads ~/.omp/agent/RULES.md as an always-apply sticky rule. Same
# stat -> backup-once -> link idempotency as the config symlink above; the
# agent dir is already ensured by the config block.

- name: Check for an existing omp RULES.md
  ansible.builtin.stat:
    path: "{{ omp_rules_file }}"
  register: _omp_rules

- name: Back up a pre-existing real omp RULES.md (once)
  ansible.builtin.copy:
    src: "{{ omp_rules_file }}"
    dest: "{{ omp_rules_file }}.pre-ansible"
    remote_src: true
    force: false
    mode: preserve
  when:
    - _omp_rules.stat.exists
    - not _omp_rules.stat.islnk

- name: Symlink the omp RULES.md to the repo-tracked file
  ansible.builtin.file:
    src: "{{ role_path }}/files/RULES.md"
    dest: "{{ omp_rules_file }}"
    state: link
    force: true

# --- Symlink the /commit extension ------------------------------------------
# omp auto-discovers ~/.omp/agent/extensions/<dir>; a dir symlink is eligible
# (see extension-loading docs). Mirrors the config symlink idempotency style.

- name: Ensure the omp extensions directory exists
  ansible.builtin.file:
    path: "{{ omp_extensions_dir }}"
    state: directory
    mode: "0755"

- name: Check for an existing commit extension entry
  ansible.builtin.stat:
    path: "{{ omp_extensions_dir }}/commit"
  register: _omp_commit_ext

- name: Back up a pre-existing real commit extension (once)
  ansible.builtin.copy:
    src: "{{ omp_extensions_dir }}/commit"
    dest: "{{ omp_extensions_dir }}/commit.pre-ansible"
    remote_src: true
    force: false
  when:
    - _omp_commit_ext.stat.exists
    - not _omp_commit_ext.stat.islnk

- name: Symlink the commit extension into the omp extensions dir
  ansible.builtin.file:
    src: "{{ role_path }}/files/extensions/commit"
    dest: "{{ omp_extensions_dir }}/commit"
    state: link
    force: true

# --- Symlink repo-tracked skills (all current + future) ---------------------
# omp auto-discovers ~/.omp/agent/skills/<name>/SKILL.md; dir symlinks are
# eligible. We find every top-level dir under files/skills/ and link each one
# into omp_skills_dir so adding a new skill directory is all that's needed.

- name: Ensure the omp skills directory exists
  ansible.builtin.file:
    path: "{{ omp_skills_dir }}"
    state: directory
    mode: "0755"

- name: Discover role-provided skill directories
  ansible.builtin.find:
    paths: "{{ role_path }}/files/skills"
    file_type: directory
    recurse: false
  register: _omp_skills

- name: Stat each target skill entry in the skills dir
  ansible.builtin.stat:
    path: "{{ omp_skills_dir }}/{{ item.path | basename }}"
  loop: "{{ _omp_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: _omp_skill_targets

- name: Back up pre-existing real skill entries (once)
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ item.stat.path }}.pre-ansible"
    remote_src: true
    force: false
    mode: preserve
  loop: "{{ _omp_skill_targets.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when:
    - item.stat.exists
    - not item.stat.islnk

- name: Remove pre-existing real skill entries so symlink can replace them
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ _omp_skill_targets.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when:
    - item.stat.exists
    - not item.stat.islnk

- name: Symlink each role skill into the omp skills dir
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ omp_skills_dir }}/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ _omp_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
