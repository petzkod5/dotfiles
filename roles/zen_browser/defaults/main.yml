---
# Official Zen Browser release assets, pinned with their upstream SHA-256 digests.
zen_browser_version: "1.21.16b"
zen_browser_release_url: "https://github.com/zen-browser/desktop/releases/download/{{ zen_browser_version }}"

zen_browser_macos_dmg_url: "{{ zen_browser_release_url }}/zen.macos-universal.dmg"
zen_browser_macos_dmg_checksum: "sha256:356068b2ad497e01d185779b747307fbacb3bc367a7510d169869608fba1d38f"
zen_browser_macos_app_path: /Applications/Zen.app
zen_browser_macos_executable_path: "{{ zen_browser_macos_app_path }}/Contents/MacOS/zen"

zen_browser_linux_appimage_arch_map:
  x86_64:
    url: "{{ zen_browser_release_url }}/zen-x86_64.AppImage"
    checksum: "sha256:640ea578efe1bb87dff85c7118145c6414a259446ef0fff5a9f569d6797397fd"
  aarch64:
    url: "{{ zen_browser_release_url }}/zen-aarch64.AppImage"
    checksum: "sha256:5e9172fc5dcc1d3527b8ad568c1de88470a8747b8b01bc384437459837aa72fc"
zen_browser_linux_bin_dir: "{{ ansible_user_dir | default(ansible_env.HOME) }}/.local/bin"
zen_browser_linux_appimage_path: "{{ zen_browser_linux_bin_dir }}/zen"

zen_browser_windows_installer_arch_map:
  x86_64:
    url: "{{ zen_browser_release_url }}/zen.installer.exe"
    checksum: "a00fd8e743402adcbb404ad122613450d78ec6972081c8b619729b72d0ee418e"
  arm64:
    url: "{{ zen_browser_release_url }}/zen.installer-arm64.exe"
    checksum: "1c3aaad4f362292b4adb2e3d15e6651ec6966d63c856b37fcc043dad3bc88112"
zen_browser_windows_install_path: 'C:\Program Files\Zen Browser\zen.exe'
