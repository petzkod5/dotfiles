---
# =============================================================================
# libreoffice role — install LibreOffice from distro packages on Linux and the
# Homebrew cask on Darwin. Optional dictionaries, fonts, Java support, and
# extensions stay out of the default install to avoid surprising bloat.
# =============================================================================
libreoffice_packages_debian:
  - libreoffice
  - libreoffice-gtk3
libreoffice_packages_archlinux:
  - libreoffice-fresh
libreoffice_packages_redhat:
  - libreoffice
libreoffice_cask_macos: libreoffice
