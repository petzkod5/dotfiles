---
# Install LibreOffice from distro packages on Linux or a Homebrew cask on
# Darwin. The role is normally reached from additional_roles, whose play runs
# become:false, so Linux package tasks escalate explicitly.

- name: Install LibreOffice (Debian)
  ansible.builtin.apt:
    name: "{{ libreoffice_packages_debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install LibreOffice (Archlinux)
  community.general.pacman:
    name: "{{ libreoffice_packages_archlinux }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install LibreOffice (RedHat)
  ansible.builtin.dnf:
    name: "{{ libreoffice_packages_redhat }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install LibreOffice (Darwin)
  community.general.homebrew_cask:
    name: "{{ libreoffice_cask_macos }}"
    state: present
  become: false
  when: ansible_facts['system'] == 'Darwin'
