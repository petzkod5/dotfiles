---
# =============================================================================
# site.yml — top-level playbook.
# -----------------------------------------------------------------------------
# Applies the shared baseline (the `common` role) to every host in inventory.
# The role resolves per-family and per-host differences automatically through
# the layered variables described in the README.
#
# Usage:
#   dotfiles sync                                  # encrypted local credentials
#   dotfiles check --skip-tags additional_roles     # config-only preview
#   dotfiles secrets                               # Bitwarden-only secret refresh
# =============================================================================
- name: Apply common baseline to all managed hosts
  hosts: all
  become: false
  gather_facts: true
  pre_tasks:
    - name: Read the cached sudo password
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/bin/dotfiles-credentials"
          - get
          - sudo-password
      register: _dotfiles_cached_become_password
      changed_when: false
      failed_when: _dotfiles_cached_become_password.rc not in [0, 1]
      check_mode: false
      no_log: true
      when: lookup('ansible.builtin.env', 'DOTFILES_BECOME_PASSWORD') | length == 0
      tags:
        - always

    - name: Supply the sudo password from dotfiles credentials
      ansible.builtin.set_fact:
        ansible_become_password: >-
          {{ lookup('ansible.builtin.env', 'DOTFILES_BECOME_PASSWORD')
             if lookup('ansible.builtin.env', 'DOTFILES_BECOME_PASSWORD') | length > 0
             else _dotfiles_cached_become_password.stdout }}
      no_log: true
      when: >-
        lookup('ansible.builtin.env', 'DOTFILES_BECOME_PASSWORD') | length > 0
        or (_dotfiles_cached_become_password.rc | default(1)) == 0
      tags:
        - always
  roles:
    - role: common
      tags:
        - common

- name: Apply additional per-host roles
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Include roles declared in additional_roles
      ansible.builtin.include_role:
        name: "{{ additional_role }}"
        apply:
          tags:
            - additional_roles
            - "{{ additional_role }}"
      loop: "{{ additional_roles | default([]) }}"
      loop_control:
        loop_var: additional_role
      tags:
        - additional_roles
